<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>segment_01 动画片段</title>
    <style>

:root {
  color-scheme: light;
  --bg: #faf9f6;
  --ink: #1a1a1a;
  --muted: #6f6a61;
  --line: rgba(26, 26, 26, 0.14);
  --accent: #ff6b00;
  --accent-soft: rgba(255, 107, 0, 0.14);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #111;
  color: var(--ink);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

.stage {
  position: relative;
  width: 100vw;
  height: calc(100vw * 2 / 3);
  max-width: calc(100vh * 3 / 2);
  max-height: 100vh;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  background: var(--bg);
}

.page {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  padding: 9% 10% 12%;
  opacity: 0;
  pointer-events: none;
  transform: translateY(18px);
  transition:
    opacity 420ms ease,
    transform 420ms ease;
}

.page.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.page-inner {
  min-width: 0;
  min-height: 0;
  display: grid;
  align-content: center;
  gap: 42px;
}

.headline {
  max-width: 86%;
  margin: 0;
  font-size: clamp(64px, 5.8vw, 176px);
  line-height: 0.98;
  letter-spacing: 0;
  font-weight: 850;
}

.subtitle {
  max-width: 72%;
  margin: 0;
  color: var(--muted);
  font-size: clamp(30px, 2.3vw, 72px);
  line-height: 1.18;
  letter-spacing: 0;
  font-weight: 650;
}

.compare-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 32px;
  max-width: 86%;
}

.compare-card {
  min-height: 280px;
  border: 3px solid var(--line);
  border-radius: 8px;
  padding: 44px;
  display: grid;
  align-content: center;
  gap: 18px;
  background: rgba(255, 255, 255, 0.44);
}

.compare-card strong {
  color: var(--accent);
  font-size: clamp(52px, 4.6vw, 132px);
  line-height: 1;
  letter-spacing: 0;
}

.compare-card span {
  color: var(--muted);
  font-size: clamp(26px, 2vw, 58px);
  line-height: 1.18;
}

.number-scale {
  max-width: 86%;
  padding: 48px 54px;
  border-left: 14px solid var(--accent);
  background: var(--accent-soft);
}

.threshold {
  width: min(86%, 2400px);
  display: grid;
  gap: 30px;
}

.threshold-track {
  position: relative;
  height: 30px;
  border-radius: 999px;
  background: var(--line);
}

.threshold-fill {
  width: 74%;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
}

.quote {
  max-width: 86%;
  display: grid;
  gap: 32px;
}

.progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 10px;
  background: rgba(26, 26, 26, 0.08);
}

.progress-bar {
  width: 0;
  height: 100%;
  background: var(--accent);
  transition: width 260ms ease;
}

    </style>
  </head>
  <body>
    <main class="stage" data-format="3:2">
      <section class="page active" data-page-id="page_01">
        <div class="page-inner big_claim">
          <h1 class="headline">项目要求越高，成本越关键</h1>
        </div>
      </section>
      <section class="page" data-page-id="page_02">
        <div class="page-inner compare">
          <h1 class="headline">同样跑 1 小时</h1>
          <div class="compare-grid">
            <div class="compare-card" data-label="GPT：约 10 元">
              <span>GPT</span>
              <strong>约 10 元</strong>
            </div>
            <div class="compare-card" data-label="Claude：10-40 元">
              <span>Claude</span>
              <strong>10-40 元</strong>
            </div>
          </div>
        </div>
      </section>
      <section class="page" data-page-id="page_03">
        <div class="page-inner number_scale">
          <div class="number-scale">
            <h1 class="headline">4000 元 × 4 = 16000 元</h1>

          </div>
        </div>
      </section>
      <section class="page" data-page-id="page_04">
        <div class="page-inner threshold_line">
          <div class="threshold">
            <h1 class="headline">4 倍价格，越过承受边界</h1>
            <div class="threshold-track"><div class="threshold-fill"></div></div>
          </div>
        </div>
      </section>
      <section class="page" data-page-id="page_05">
        <div class="page-inner quote_punch">
          <div class="quote">
            <h1 class="headline">成本更稳，编程也强</h1>

          <p class="subtitle">很难不选择 GPT</p>
          </div>
        </div>
      </section>
      <div class="progress" aria-hidden="true"><div class="progress-bar"></div></div>
    </main>
    <script>

(function () {
  const pages = Array.from(document.querySelectorAll(".page"));
  const progressBar = document.querySelector(".progress-bar");
  let current = 0;

  function showPage(index) {
    current = Math.max(0, Math.min(index, pages.length - 1));
    pages.forEach((page, pageIndex) => {
      page.classList.toggle("active", pageIndex === current);
    });

    if (progressBar) {
      progressBar.style.width = ((current + 1) / pages.length) * 100 + "%";
    }
  }

  window.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight" || event.key === " " || event.key === "Enter") {
      event.preventDefault();
      showPage(current + 1);
    }

    if (event.key === "ArrowLeft" || event.key === "Backspace") {
      event.preventDefault();
      showPage(current - 1);
    }
  });

  showPage(0);
})();

    </script>
  </body>
</html>
